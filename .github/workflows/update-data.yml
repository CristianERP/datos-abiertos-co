name: Actualizar datos

on:
  schedule:
    - cron: "0 10 * * *"  # 05:00 hora Colombia (UTC-5)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependencias
        run: poetry install --no-root

      - name: Descargar y procesar datasets
        run: |
          poetry run python etl/fetch.py
          poetry run python etl/transform.py

      - name: Commitear datos actualizados
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Actualizar datos $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push hecho con el GITHUB_TOKEN de este workflow NO dispara el
      # "on: push" de deploy.yml (GitHub lo bloquea para evitar loops
      # infinitos) -> lo disparamos explícitamente vía la API.
      - name: Disparar publicación del sitio
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
