name: Actualizar datos

on:
  schedule:
    - cron: "0 10 * * *"  # 05:00 hora Colombia (UTC-5)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Poetry
        run: pipx install poetry

      - name: Instalar dependencias
        run: poetry install --no-root

      - name: Descargar y procesar datasets
        run: |
          poetry run python etl/fetch.py
          poetry run python etl/transform.py

      - name: Commitear datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Sin cambios en los datos" || git commit -m "Actualizar datos $(date -u +%Y-%m-%d)"
          git push
