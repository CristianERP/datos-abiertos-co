# Registro de datasets a consumir desde datos.gov.co (Socrata).
#
# Cada entrada tiene dos partes:
# - Extracción: dataset_id + select/group/where/order/limit (opcionales). Si se
#   dan, fetch.py le pide a la API una agregación (SoQL) en vez de traer las
#   filas crudas -> útil para datasets grandes (ver homicidios: 344k filas
#   crudas -> ~3900 agregadas por año/mes/departamento).
# - Visualización: categoria (agrupa el menú de navegación), titulo (nombre de
#   la página/enlace), y viz (cómo transform.py/el sitio arman la gráfica:
#   dimensión a filtrar y series a graficar).

datasets:
  - id: gastos_pgn_mensual
    categoria: Hacienda y Presupuesto
    titulo: Gastos del Presupuesto General de la Nación
    ministerio: Ministerio de Hacienda y Crédito Público
    dataset_id: 5phs-yqfw
    frecuencia: mensual
    descripcion: >
      Apropiación vigente vs. pagos realizados, por sector, desde 2019.
    select: >
      anio, nombremes, sector,
      sum(apropiacionvigente) as apropiacion_vigente,
      sum(compromisos) as compromisos,
      sum(obligaciones) as obligaciones,
      sum(pagos) as pagos
    group: anio, nombremes, sector
    order: anio, nombremes
    limit: 10000
    viz:
      dim_field: sector
      dim_label: Sector
      dim_todos_label: Todos los sectores
      series:
        - { key: apropiacion_vigente, label: "Apropiación vigente", color_var: "--series-1" }
        - { key: pagos, label: Pagos, color_var: "--series-2" }
      pct: { key: pct_pagado, numeratorKey: pagos, denominatorKey: apropiacion_vigente, label: "% pagado" }

  - id: homicidios
    categoria: Seguridad y Defensa
    titulo: Homicidios
    ministerio: Ministerio de Defensa Nacional / Policía Nacional
    dataset_id: m8fd-ahd9
    frecuencia: mensual
    descripcion: >
      Homicidios reportados por la Policía Nacional, por departamento, desde 2016.
    select: >
      date_extract_y(fecha_hecho) as anio,
      date_extract_m(fecha_hecho) as mes_num,
      departamento,
      sum(cantidad) as total_casos
    group: anio, mes_num, departamento
    where: "fecha_hecho >= '2016-01-01'"
    order: anio, mes_num
    limit: 10000
    viz:
      dim_field: departamento
      dim_label: Departamento
      dim_todos_label: Todos los departamentos
      series:
        - { key: total_casos, label: Casos, color_var: "--series-3" }

