# Registro de datasets a consumir desde datos.gov.co (Socrata).
# Cada entrada define de dónde sale el dato y cada cuánto se debe refrescar.
#
# select/group/order son opcionales: si se dan, fetch.py pide a la API una
# agregación (SoQL) en vez de traer las filas crudas. Útil para datasets
# grandes donde no tiene sentido descargar el detalle completo (ver
# gastos_pgn_mensual: 613k filas crudas -> ~2900 agregadas por año/mes/sector).

datasets:
  - id: gastos_pgn_mensual
    ministerio: Ministerio de Hacienda y Crédito Público
    dataset_id: 5phs-yqfw
    frecuencia: mensual
    descripcion: >
      Información de Gastos del Presupuesto General de la Nación, agregada por
      año, mes y sector: apropiación vigente vs. compromisos, obligaciones y pagos
    select: >
      anio, nombremes, sector,
      sum(apropiacionvigente) as apropiacion_vigente,
      sum(compromisos) as compromisos,
      sum(obligaciones) as obligaciones,
      sum(pagos) as pagos
    group: anio, nombremes, sector
    order: anio, nombremes
    limit: 10000
